name: Release monorepo packages
on:
  workflow_dispatch:

env:
  CPU_CORES: 2
  HUSKY: 0

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: npm-release
      url: https://www.npmjs.com/org/speclynx
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          registry-url: https://registry.npmjs.org
      - name: Install monorepo dependencies
        run: npm ci --engine-strict=false
      - name: Build monorepo
        run: npm run build
      - name: Check TypeScript types
        run: npm run typescript:check-types
      - name: Execute tests in monorepo
        run: npm run test
      - name: Version bump & GitHub release
        run: |
          git config user.email "vladimir.gorej@gmail.com"
          git config user.name "Vladimir Gorej"
          npx lerna version --conventional-commits --no-private --yes --force-publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Publish monorepo npm packages
        # Provenance signing fails with TLOG_CREATE_ENTRY_ERROR (409) when Rekor answers after
        # the sigstore client timeout: the client resends the entry Rekor already stored. npm
        # passes its fetch timeout to sigstore, but lerna doesn't, so sigstore defaults to 5s.
        # npm_config_timeout raises it. Publishing one package at a time eases the load on Rekor.
        # `from-package` only publishes versions missing from the registry, and a new attempt
        # signs a fresh attestation, so retrying the whole step is safe.
        env:
          npm_config_timeout: 60000
        run: |
          for attempt in 1 2 3; do
            npx lerna publish from-package --no-private --yes --concurrency 1 && exit 0
            echo "::warning::lerna publish attempt ${attempt} failed"
            # lerna leaves a temporary gitHead in package.json files when publishing aborts
            git checkout -- package.json 'packages/*/package.json'
            sleep 30
          done
          exit 1
